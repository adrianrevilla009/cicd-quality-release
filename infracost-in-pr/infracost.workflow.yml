name: infracost
on:
  pull_request:
    paths: ["terraform/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  cost:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: infracost breakdown --config-file infracost.yml --format json --out-file /tmp/cost.json
      - run: infracost comment github --path /tmp/cost.json --repo $GITHUB_REPOSITORY --pull-request ${{ github.event.pull_request.number }} --github-token ${{ secrets.GITHUB_TOKEN }} --behavior update
