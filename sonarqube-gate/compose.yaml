services:
  db:
    image: postgres:16.4
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-change-me}
      POSTGRES_DB: sonar
    volumes: [db-data:/var/lib/postgresql/data]
  sonarqube:
    image: sonarqube:10.7.0-community
    depends_on: [db]
    ports: ["9000:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-change-me}
volumes:
  db-data: {}
